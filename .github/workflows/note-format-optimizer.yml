name: note format optimizer

on:
  schedule:
    # 18:17 UTC = 03:17 JST. The off-hour minute reduces GitHub Actions congestion.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-format-optimizer
  cancel-in-progress: false

jobs:
  update-playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the HTTP dependency
        run: python -m pip install "httpx>=0.27,<1" "defusedxml>=0.7,<1"

      - name: Restore the previous private-free measurements
        shell: bash
        run: |
          git fetch origin note-format-data:refs/remotes/origin/note-format-data || true
          if git show-ref --verify --quiet refs/remotes/origin/note-format-data; then
            git show origin/note-format-data:data/note_trend_snapshots.json > data/note_trend_snapshots.json
            git show origin/note-format-data:data/note_format_playbook.json > data/note_format_playbook.json
          fi

      - name: Measure public reaction growth and article structure
        run: >-
          python -m scripts.update_note_format_playbook
          --config config/note_trend_sources.json
          --snapshots data/note_trend_snapshots.json
          --playbook data/note_format_playbook.json

      - name: Publish data without redeploying Streamlit
        shell: bash
        run: |
          publish_dir="$RUNNER_TEMP/note-format-data"
          mkdir -p "$RUNNER_TEMP/note-format-output"
          cp data/note_trend_snapshots.json "$RUNNER_TEMP/note-format-output/"
          cp data/note_format_playbook.json "$RUNNER_TEMP/note-format-output/"
          if git show-ref --verify --quiet refs/remotes/origin/note-format-data; then
            git worktree add -b note-format-data "$publish_dir" origin/note-format-data
          else
            git worktree add -b note-format-data "$publish_dir" HEAD
          fi
          mkdir -p "$publish_dir/data"
          cp "$RUNNER_TEMP/note-format-output/"*.json "$publish_dir/data/"
          cd "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/note_trend_snapshots.json data/note_format_playbook.json
          if git diff --cached --quiet; then
            echo "No format data changes"
          else
            git commit -m "Update note format playbook"
            git push origin note-format-data
          fi
