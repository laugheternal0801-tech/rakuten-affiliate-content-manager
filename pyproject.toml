[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "RUF"]
ignore = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^src/", "^test/"]
